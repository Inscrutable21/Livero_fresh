name: livero_fresh
description: Livero Fresh — 10-minute grocery delivery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assests/3.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assests/1.jpeg
    - assests/3.png
    - assests/1.png
    - assests/royal_duo.jpg
